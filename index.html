<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>University Outreach Tool</title><link rel="stylesheet" href="styles.css"></head><body><div class="app"><aside><div class="brand">UO <span>University Outreach</span></div><nav><button data-view="dashboard" class="active">Dashboard</button><button data-view="universities">Universities</button><button data-view="contacts">Contacts</button><button data-view="followups">Follow-ups</button><button data-view="activity">Activity</button><button data-view="import">Import</button><button data-view="analytics">Analytics</button><button data-view="settings">Settings</button></nav></aside><main><header><input id="globalSearch" placeholder="Search universities, contacts or email..."><button id="addUniversityBtn">+ Add University</button></header><section id="viewContainer"></section></main></div><div id="modalBackdrop" class="modal-backdrop hidden"><form id="universityForm" class="modal"><h2>Add university</h2><input name="universityName" required placeholder="University name"><input name="country" required placeholder="Country"><select name="stage"><option>Not Contacted</option><option>Introduction</option><option>Discovery</option><option>Partnership</option><option>Not Interested</option></select><textarea name="notes" placeholder="Notes"></textarea><div><button type="button" id="cancelModal">Cancel</button><button type="submit">Save University</button></div></form></div><script src="app.js"></script></body></html>
