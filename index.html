<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>University Outreach Tool</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body>
  <div class="app">
    <aside>
      <div class="brand">UO <span>University Outreach</span></div>
      <nav>
        <button data-view="dashboard" class="active">Dashboard</button>
        <button data-view="universities">Universities</button>
        <button data-view="contacts">Contacts</button>
        <button data-view="followups">Follow-ups</button>
        <button data-view="activity">Activity</button>
        <button data-view="import">Import</button>
        <button data-view="research">Research</button>
        <button data-view="verification">Verification</button>
        <button data-view="emails">Emails</button>
        <button data-view="analytics">Analytics</button>
        <button data-view="settings">Settings</button>
      </nav>
    </aside>

    <main>
      <header>
        <input id="globalSearch" placeholder="Search universities, contacts or email...">
        <div class="header-actions">
          <span id="connectionStatus" class="connection-status">Connecting…</span>
          <button id="addUniversityBtn">+ Add University</button>
        </div>
      </header>
      <section id="viewContainer"></section>
    </main>
  </div>

  <div id="modalBackdrop" class="modal-backdrop hidden">
    <form id="universityForm" class="modal">
      <div class="modal-heading">
        <div><h2 id="modalTitle">Add university</h2><p id="modalSubtitle">Create a university record.</p></div>
        <button type="button" class="icon-button" id="closeModal" aria-label="Close">×</button>
      </div>
      <div id="formMessage" class="form-message hidden"></div>
      <div id="modalFields" class="form-grid"></div>
      <div class="modal-actions">
        <button type="button" id="cancelModal">Cancel</button>
        <button type="submit" class="primary" id="saveModalBtn">Save</button>
      </div>
    </form>
  </div>

  <div id="toast" class="toast hidden" role="status"></div>
  <script src="app.js"></script>
</body>
</html>
