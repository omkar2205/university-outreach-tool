<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>University Outreach Tool</title>
  <link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="final.css">
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body>
<div class="app"><aside><div class="brand">UO <span>University Outreach</span></div><nav>
<button data-view="dashboard" class="active">Dashboard</button><button data-view="universities">Universities</button><button data-view="contacts">Contacts</button><button data-view="followups">Follow-ups</button><button data-view="activity">Activity</button><button data-view="import">Import</button><button data-view="research">Research</button><button data-view="verification">Verification</button><button data-view="emails">Emails</button><button data-view="analytics">Analytics</button><button data-view="settings">Settings</button>
</nav></aside><main><header><input id="globalSearch" placeholder="Search universities, contacts or email..."><div class="header-actions"><span id="connectionStatus" class="connection-status">Connecting…</span><button id="addUniversityBtn">+ Add University</button></div></header><section id="viewContainer"></section></main></div>
<div id="modalBackdrop" class="modal-backdrop hidden"><form id="universityForm" class="modal"><div class="modal-heading"><div><h2>Add university</h2><p>Create a new university record in the central database.</p></div><button type="button" class="icon-button" id="closeModal">×</button></div><div id="formMessage" class="form-message hidden"></div><div class="form-grid"><label class="span-2">University name<input name="universityName" required></label><label>Country<input name="country" required></label><label>Region<input name="region"></label><label>Category<select name="category" id="categorySelect"><option value="">Select category</option></select></label><label>Reference<select name="referenceSource" id="referenceSelect"><option>Normal</option></select></label><label>Stage<select name="outreachStage" id="stageSelect"><option>Not Contacted</option></select></label><label>Website<input name="website"></label><label class="span-2">Notes<textarea name="generalNotes" rows="4"></textarea></label></div><div class="modal-actions"><button type="button" id="cancelModal">Cancel</button><button type="submit" class="primary" id="saveUniversityBtn">Save University</button></div></form></div>
<div id="dynamicModal" class="modal-backdrop hidden"><form id="dynamicForm" class="modal"><div class="modal-heading"><div><h2 id="dynamicTitle"></h2><p id="dynamicSubtitle"></p></div><button type="button" class="icon-button" id="dynamicClose">×</button></div><div id="dynamicMessage" class="form-message hidden"></div><div id="dynamicFields" class="form-grid"></div><div class="modal-actions"><button type="button" id="dynamicCancel">Cancel</button><button type="submit" class="primary" id="dynamicSave">Save</button></div></form></div>
<div id="toast" class="toast hidden" role="status"></div><script src="app.js"></script><script src="final.js"></script></body></html>
